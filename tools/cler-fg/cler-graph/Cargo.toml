[package]
name = "cler-graph"
version = "0.1.0"
edition = "2021"
description = "Headless parser for cler desktop flowgraph source files"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
