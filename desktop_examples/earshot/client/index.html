<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cler earshot</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 9a6.5 6.5 0 0 1 13 0c0 5-5.5 5-5.5 8.5a3.25 3.25 0 0 1-6.5 0" stroke="%23e6edf3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9a3 3 0 0 1 6 0" stroke="%233987e5" stroke-width="1.8" stroke-linecap="round"/></svg>'>
<style>
  /* Tokens are the ones cler-fg (app.css) and the ImGui apps (cler_palette.hpp)
     already share; only --trace and --rec are earshot's own, because a spectrum
     line is data, not chrome, and must never be the interaction colour. */
  :root {
    color-scheme: dark;
    --bg-0:#0e1116; --bg-1:#161b22; --bg-2:#1e242d;
    --border:#2a323d; --border-hi:#3a444f;
    --fg:#e6edf3; --muted:#8b98a9; --faint:#6b7787;
    /* the ground reads on the accent fill at 5.20:1; white only manages 3.64 */
    --accent:#3987e5; --accent-fg:#0e1116;
    --ok:#5ec27a; --warn:#e0b341; --danger:#e66767;
    --trace:#4aa3ff; --rec:#e66767;
    --danger-bg:#37181c; --danger-border:#6e2a30;
    --warn-bg:#332b18; --warn-border:#6b551f;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg-0); color:var(--fg); font:14px system-ui, sans-serif; }
  .mono { font-family:var(--mono); }
  .hidden { display:none !important; }
  .spacer { flex:1; }
  .note { color:var(--muted); font-size:12px; }
  .warnnote { color:var(--warn); font-size:12px; }

  #app { display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:1fr 320px; height:100%; }

  /* top bar: identity, one menu, the tuned frequency, status */
  header { grid-column:1/3; display:flex; gap:12px; align-items:center; padding:6px 12px;
           background:var(--bg-1); border-bottom:1px solid var(--border); }
  .brand { font-weight:600; color:var(--fg); letter-spacing:.02em; display:flex; align-items:center; gap:7px; }
  #freq { width:170px; font-size:20px; font-family:var(--mono); font-variant-numeric:tabular-nums;
          background:transparent; color:var(--fg); border:none; border-bottom:1px solid var(--border); text-align:right; padding:2px 4px; }
  #freq:focus { outline:none; border-bottom-color:var(--accent); }
  #freq.bad { border-bottom-color:var(--danger); color:var(--danger); }
  .pill { padding:2px 8px; border-radius:10px; background:var(--bg-2); color:var(--muted); font-size:12px; white-space:nowrap; }
  .pill.ok { color:var(--ok); } .pill.ctl { color:var(--accent); }
  .pill.rec { color:var(--rec); animation:blink 1s steps(2,end) infinite; }
  @keyframes blink { 50% { opacity:.35; } }

  button { background:var(--bg-2); color:var(--fg); border:1px solid var(--border); border-radius:4px;
           padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover:not(:disabled) { border-color:var(--border-hi); }
  button:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  /* dim by token, never by alpha: a disabled control still carries its reason */
  button:disabled { color:var(--faint); border-color:var(--border); cursor:not-allowed; }
  input:disabled, select:disabled { color:var(--faint); background:var(--bg-1); cursor:not-allowed; }
  input[type=text], input[type=number], select { background:var(--bg-0); color:var(--fg);
           border:1px solid var(--border); border-radius:3px; padding:3px 6px; font:inherit; }

  /* menus are <details>, dialogs are <dialog>: Esc, backdrop and focus trap for free */
  .menu { position:relative; }
  .menu > summary { list-style:none; cursor:pointer; padding:4px 10px; border:1px solid var(--border);
                    border-radius:4px; background:var(--bg-2); font-size:13px; }
  .menu > summary::-webkit-details-marker { display:none; }
  .menu[open] > summary { border-color:var(--accent); }
  .menu-items { position:absolute; z-index:20; top:calc(100% + 4px); left:0; min-width:260px;
                background:var(--bg-2); border:1px solid var(--border); border-radius:6px; padding:8px;
                display:flex; flex-direction:column; gap:4px; box-shadow:0 8px 30px #0008; }
  .menu-items button { background:none; border:none; text-align:left; padding:8px 12px; border-radius:3px; font-size:14px; }
  .menu-items button:hover:not(:disabled) { background:var(--bg-1); }
  .menu-items label { display:flex; gap:8px; align-items:baseline; padding:4px 8px; border-radius:3px; }
  .menu-items label.off { color:var(--faint); }
  .menu-items .cost { color:var(--muted); font-size:12px; margin-left:auto; }
  .menu-items .band { color:var(--faint); font-size:12px; }
  .menu-items .reason { color:var(--faint); font-size:12px; padding:0 8px 6px 30px; max-width:280px; }
  /* the decoder list lives in the pane, not behind a menu: options you cannot
     see are options nobody turns on */
  .declist { display:flex; flex-direction:column; gap:2px; margin-bottom:6px; }
  .declist label { display:flex; gap:8px; align-items:baseline; padding:4px 6px; border-radius:3px; }
  .declist label.off { color:var(--faint); }
  .declist .cost { color:var(--muted); font-size:12px; margin-left:auto; }
  .declist .band { color:var(--faint); font-size:12px; }
  .declist .reason { color:var(--faint); font-size:12px; padding:0 6px 4px 28px; max-width:280px; }
  /* cler-fg's blocked-tip: a disabled control shows its reason on hover, not
     only in the native title tooltip */
  [data-tip] { position:relative; }
  [data-tip]:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:0;
    z-index:30; width:max-content; max-width:280px; padding:4px 8px; border:1px solid var(--border-hi);
    border-radius:4px; background:var(--bg-2); color:var(--fg); font-size:11px; line-height:1.35;
    box-shadow:0 4px 14px #0007; pointer-events:none; }

  main { display:grid; grid-template-rows:180px 1fr; min-height:0; min-width:0; position:relative; }
  .plot { position:relative; min-height:0; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #cursor { position:absolute; right:8px; top:6px; font-family:var(--mono); font-size:12px;
            color:var(--muted); background:color-mix(in srgb, var(--bg-0) 70%, transparent); padding:1px 6px; border-radius:3px; }
  #resetzoom { position:absolute; right:8px; bottom:8px; font-size:12px; padding:2px 8px; }
  #banner { position:absolute; z-index:8; left:0; right:0; top:0; background:var(--danger-bg);
            border-bottom:1px solid var(--danger-border); color:var(--danger); padding:8px 12px; font-size:13px; }
  #errors { position:absolute; right:10px; bottom:36px; z-index:6; display:flex; flex-direction:column; gap:4px; }
  #errors:empty { display:none; }
  .toast { background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger);
           padding:6px 10px; border-radius:4px; font-size:12px; max-width:340px; }

  aside { background:var(--bg-1); border-left:1px solid var(--border); overflow:auto; min-width:0;
          display:flex; flex-direction:column; }
  .tabs { display:flex; gap:4px; padding:8px 10px 0; }
  .tab { flex:1; border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .pane { padding:10px; display:flex; flex-direction:column; gap:12px; }
  section { display:flex; flex-direction:column; gap:6px; }
  .sec-head { display:flex; align-items:center; gap:6px; }
  h3 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .modes { display:flex; flex-wrap:wrap; gap:4px; }
  .modes button { font-size:13px; }
  .ctl { display:grid; grid-template-columns:1fr; gap:3px; padding:4px 0; border-bottom:1px solid var(--border); }
  .ctl-name { color:var(--muted); font-size:12px; }
  .ctl-value { font-size:13px; }
  .ctl-note { color:var(--faint); font-size:11px; }
  .ctl input[type=range] { width:100%; accent-color:var(--accent); }
  .field { display:grid; grid-template-columns:44px 1fr; gap:6px; align-items:center; }
  .field > span { color:var(--muted); font-size:12px; }

  footer { grid-column:1/3; display:flex; gap:12px; align-items:center; padding:5px 12px;
           background:var(--bg-1); border-top:1px solid var(--border); color:var(--muted);
           font-size:12px; font-variant-numeric:tabular-nums; }
  footer button { padding:3px 10px; }
  #recbtn.on { background:var(--rec); border-color:var(--rec); color:#1a0f10; }
  #listenbtn.pulse { border-color:var(--warn); color:var(--warn); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 30%, transparent); } }

  dialog { background:var(--bg-1); color:var(--fg); border:1px solid var(--border); border-radius:8px;
           padding:0; max-width:min(560px, 100vw - 24px); width:100%; }
  dialog::backdrop { background:color-mix(in srgb, var(--bg-0) 72%, transparent); }
  .dlg-head { display:flex; align-items:center; gap:8px; padding:12px 16px 8px; }
  .dlg-head h2 { margin:0; font-size:15px; flex:1; }
  .dlg-body { padding:0 16px 16px; max-height:60vh; overflow:auto; }
  .row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); }
  .row .lbl { flex:1; min-width:0; overflow-wrap:anywhere; }
  .row .kind { color:var(--muted); font-size:12px; }
  .row.failed .lbl { color:var(--danger); }
  .why { color:var(--danger); background:var(--danger-bg); border-left:2px solid var(--danger-border);
         font-size:12px; padding:5px 8px; margin:0 0 6px; border-radius:0 3px 3px 0; }
  .confirm { color:var(--danger); font-size:12px; }
  a { color:var(--accent); }

  #text { font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:var(--muted); }
  #text table { border-collapse:collapse; width:100%; }
  #text th { text-align:left; color:var(--muted); font-weight:500; border-bottom:1px solid var(--border); }
  #text td { border-bottom:1px solid var(--border); padding-right:6px; color:var(--fg); }
  #text tr.stale td { color:var(--faint); }
  #dectabs { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:12px; padding:2px 8px; }
  .chip.warn { border-color:var(--warn); color:var(--warn); }
  .chip.warn.on { background:var(--warn); color:#1a1508; }
  .chip-warn { background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn);
               padding:3px 6px; border-radius:4px; margin-bottom:6px; font-family:system-ui, sans-serif; }

  /* one column below 900px: the plots keep the width, the panel becomes a sheet */
  @media (max-width:900px) {
    #app { grid-template-columns:1fr; grid-template-rows:auto 1fr auto auto; }
    header, footer { grid-column:1; }
    header { flex-wrap:wrap; row-gap:6px; }
    aside { border-left:none; border-top:1px solid var(--border); max-height:45vh; }
    main { grid-template-rows:140px 1fr; min-height:220px; }
    footer { flex-wrap:wrap; row-gap:4px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true"><path d="M6 9a6.5 6.5 0 0 1 13 0c0 5-5.5 5-5.5 8.5a3.25 3.25 0 0 1-6.5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9a3 3 0 0 1 6 0" stroke="#3987e5" stroke-width="1.8" stroke-linecap="round"/></svg> earshot</span>
    <details class="menu" id="menu">
      <summary data-testid="menu" aria-label="menu" title="menu">☰</summary>
      <div class="menu-items">
        <button id="menu-sources" data-testid="menu-sources">sources…</button>
        <button id="menu-recordings" data-testid="menu-recordings">recordings…</button>
      </div>
    </details>
    <input id="freq" data-testid="freq" type="text" value="—" title="tune: 100.1, 100.1M or 433920k"
           placeholder="100.1 or 100.1M or 433920k">
    <span id="source" class="pill" data-testid="source">no source</span>
    <span id="recchip" class="pill rec hidden" data-testid="rec-chip">● recording</span>
    <span class="spacer"></span>
    <span id="role" class="pill" data-testid="role">—</span>
    <span id="conn" class="pill" data-testid="conn">connecting…</span>
  </header>

  <main>
    <div id="banner" class="hidden" data-testid="banner"></div>
    <div class="plot">
      <canvas id="spec" tabindex="0" aria-label="spectrum"></canvas>
      <span id="cursor" data-testid="cursor"></span>
    </div>
    <div class="plot">
      <canvas id="wf" tabindex="0" aria-label="waterfall: double-click to tune, drag to pan, wheel to zoom"></canvas>
      <button id="resetzoom" class="hidden" data-testid="reset-zoom" title="show the whole span">⤢ reset zoom</button>
    </div>
    <div id="errors"></div>
  </main>

  <aside>
    <div class="tabs">
      <button id="tab-rx" class="tab on" data-testid="tab-receiver">Receiver</button>
      <button id="tab-dec" class="tab" data-testid="tab-decoded">Decoded</button>
    </div>

    <div id="pane-rx" class="pane">
      <section>
        <h3>mode</h3>
        <div id="modes" class="modes"></div>
        <span id="passband" class="note"></span>
      </section>
      <section id="sec-display">
        <div class="sec-head">
          <h3>display</h3>
          <span class="spacer"></span>
          <details class="menu" id="dispmenu">
            <summary data-testid="display-menu">⋯</summary>
            <div class="menu-items">
              <label><input id="dispauto" data-testid="display-auto" type="checkbox" checked> auto range</label>
              <label>floor (dB) <input id="dispfloor" data-testid="display-floor" type="number" step="5" style="width:70px"></label>
              <label>range (dB) <input id="disprange" data-testid="display-range" type="number" step="10" min="10" max="160" style="width:70px"></label>
              <button id="dispreset" data-testid="display-reset">reset display</button>
            </div>
          </details>
        </div>
        <span id="dispnote" class="note" data-testid="display-note"></span>
      </section>
      <section id="sec-controls">
        <h3 id="controls-title">source</h3>
        <div id="controls"></div>
      </section>
      <section id="transport" class="hidden">
        <h3>playback</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <button id="playpause" data-testid="playpause">⏸</button>
          <input id="pos" data-testid="pos" type="range" min="0" max="1" step="0.1" value="0" style="flex:1">
          <span id="postime" class="note">0:00</span>
        </div>
        <label class="note"><input id="loop" data-testid="loop" type="checkbox"> loop</label>
      </section>
      <section id="sec-record">
        <h3>record</h3>
        <div class="field hidden" id="recdirrow"><span>to</span><select id="recdir" data-testid="recdir"></select></div>
        <div class="field hidden" id="recdironerow"><span>to</span><span id="recdirone" class="mono note" data-testid="recdir-one"></span></div>
        <div class="field"><span>name</span><input id="recname" data-testid="recname" type="text"></div>
        <span id="recprev" class="note mono" data-testid="rec-preview"></span>
        <span id="recfree" class="note" data-testid="rec-free"></span>
      </section>
    </div>

    <div id="pane-dec" class="pane hidden">
      <section>
        <div class="sec-head">
          <h3>decoded</h3>
          <span class="spacer"></span>
          <!-- ponytail: list inline, not behind a ⋯ menu — see .declist note -->
        </div>
        <div class="declist" id="decmenu-items"></div>
        <span id="deccost" class="note" data-testid="decoder-cost"></span>
        <div id="dectabs"></div>
        <div id="text"></div>
        <span id="decempty" class="note hidden" data-testid="decoder-empty">nothing decoding — tick a decoder above to start it</span>
      </section>
    </div>
  </aside>

  <footer>
    <button id="listenbtn" data-testid="listen">▶ listen</button>
    <input id="vol" data-testid="volume" type="range" min="0" max="1" step="0.01" value="0.8"
           style="width:90px;accent-color:var(--accent)" title="volume — this browser only">
    <button id="recbtn" data-testid="record">● record</button>
    <span id="recstatus" data-testid="rec-status"></span>
    <span class="spacer"></span>
    <span id="s-stats" data-testid="stats">—</span>
    <span id="s-audio">audio: off</span>
    <span id="s-ver"></span>
  </footer>

  <dialog id="dlg-sources" data-testid="dlg-sources">
    <div class="dlg-head">
      <h2>Sources</h2>
      <details class="menu" id="srcmenu">
        <summary data-testid="sources-menu">⋯</summary>
        <div class="menu-items">
          <button id="rescan" data-testid="rescan">rescan devices</button>
          <label>sample rate on connect <select id="devrate" data-testid="devrate"></select></label>
        </div>
      </details>
      <button data-close data-testid="sources-close">Close</button>
    </div>
    <div class="dlg-body"><div id="devlist"></div></div>
  </dialog>

  <dialog id="dlg-recordings" data-testid="dlg-recordings">
    <div class="dlg-head">
      <h2>Recordings</h2>
      <button data-close data-testid="recordings-close">Close</button>
    </div>
    <div class="dlg-body">
      <div id="recdirinfo" class="note"></div>
      <div id="recscp" class="note mono" style="overflow-wrap:anywhere"></div>
      <div id="recpruned" class="note"></div>
      <div id="reclist" style="margin-top:8px">—</div>
    </div>
  </dialog>
</div>
<script type="module" src="/client/app.js"></script>
</body>
</html>
